<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird Clone</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        canvas {
            display: block;
            background-color: #70c5ce; /* Sky blue */
            border: 2px solid #000;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .score-display {
            position: absolute;
            top: 10%;
            font-size: 40px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 0 #000;
            z-index: 10;
        }

            .game-over-screen {
        background: rgba(0, 0, 0, 0.7);
        padding: 20px 40px;
        border-radius: 10px;
        text-align: center;
        color: white;
        display: none !important;
        pointer-events: none;
    }
    .game-over-screen.show {
        display: flex !important;
        pointer-events: auto;
    }

        .game-over-screen h2 {
            margin: 0 0 10px 0;
            font-size: 30px;
            color: #ff4444;
        }

        .game-over-screen p {
            margin: 0 0 20px 0;
            font-size: 20px;
        }

        button {
            background-color: #4CAF50;
            border: none;
            color: white;
            padding: 10px 20px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #45a049;
        }

        .start-screen {
            background: rgba(0, 0, 0, 0.7);
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .start-screen h1 {
            font-size: 36px;
            margin-bottom: 10px;
            color: #FFD700;
        }

        .start-screen p {
            font-size: 18px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="320" height="480"></canvas>
    <div id="ui-layer">
        <div class="score-display" id="score">0</div>
        
        <div class="start-screen" id="start-screen">
            <h1>Flappy Bird</h1>
            <p>Press Space or Click to Fly</p>
            <button onclick="startGame()">Start Game</button>
        </div>

        <div class="game-over-screen" id="game-over-screen">
            <h2>Game Over</h2>
            <p>Score: <span id="final-score">0</span></p>
            <button onclick="resetGame()">Play Again</button>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const startScreen = document.getElementById('start-screen');
    const gameOverScreen = document.getElementById('game-over-screen');
    const finalScoreEl = document.getElementById('final-score');

    // Game State
    let frames = 0;
    let score = 0;
    let gameState = 'START'; // START, PLAYING, GAMEOVER
    let gameSpeed = 1.5;

    // Bird Object
    const bird = {
        x: 50,
        y: 150,
        width: 20,
        height: 20,
        radius: 10,
        velocity: 0,
        gravity: 0.15,
        jumpStrength: -6.5,
        rotation: 0,

        draw: function() {
            ctx.save();
            ctx.translate(this.x, this.y);
            // Rotate bird based on velocity
            this.rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, (this.velocity * 0.1)));
            ctx.rotate(this.rotation);

            // Body
            ctx.fillStyle = "#FFD700";
            ctx.beginPath();
            ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "#000";
            ctx.lineWidth = 1;
            ctx.stroke();

            // Eye
            ctx.fillStyle = "#FFF";
            ctx.beginPath();
            ctx.arc(4, -4, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            
            // Pupil
            ctx.fillStyle = "#000";
            ctx.beginPath();
            ctx.arc(5, -4, 1, 0, Math.PI * 2);
            ctx.fill();

            // Beak
            ctx.fillStyle = "#FFA500";
            ctx.beginPath();
            ctx.moveTo(6, 2);
            ctx.lineTo(12, 5);
            ctx.lineTo(6, 8);
            ctx.fill();
            ctx.stroke();

            // Wing
            ctx.fillStyle = "#F0E68C";
            ctx.beginPath();
            ctx.ellipse(-2, 2, 6, 4, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.restore();
        },

        update: function() {
            this.velocity += this.gravity;
            this.y += this.velocity;

            // Floor collision
            if (this.y + this.radius >= (canvas.height || 480) - 20) {
                console.log('FLOOR COLLISION', {birdY: this.y, birdVel: this.velocity, canvasH: (canvas.height || 480), groundY: (canvas.height || 480) - 20});
                this.y = (canvas.height || 480) - 20 - this.radius;
                gameOver();
            }

            // Ceiling collision (optional, prevents flying over pipes)
            if (this.y - this.radius <= 0) { // Canvas top is 0
                this.y = this.radius;
                this.velocity = 0;
            }
        },

        flap: function() {
            this.velocity = this.jumpStrength;
        },

        reset: function() {
            console.log('bird.reset() called, canvas.height:', canvas.height);
            this.y = (canvas.height || 480) / 2; // Center vertically with fallback
            console.log('bird.reset() set y to:', this.y);
            this.velocity = 0;
            this.rotation = 0;
        }
    };

    // Pipes
    const pipes = {
        items: [],
        width: 40,
        gap: 100,
        dx: 1.5,

        draw: function() {
            for (let i = 0; i < this.items.length; i++) {
                let p = this.items[i];
                
                // Pipe Color
                ctx.fillStyle = "#2E8B57"; // SeaGreen
                ctx.strokeStyle = "#000";
                ctx.lineWidth = 2;

                // Top Pipe
                ctx.fillRect(p.x, 0, this.width, p.top);
                ctx.strokeRect(p.x, 0, this.width, p.top);
                
                // Top Pipe Cap
                ctx.fillRect(p.x - 2, p.top - 20, this.width + 4, 20);
                ctx.strokeRect(p.x - 2, p.top - 20, this.width + 4, 20);

                // Bottom Pipe
                ctx.fillRect(p.x, canvas.height - p.bottom, this.width, p.bottom);
                ctx.strokeRect(p.x, canvas.height - p.bottom, this.width, p.bottom);

                // Bottom Pipe Cap
                ctx.fillRect(p.x - 2, canvas.height - p.bottom, this.width + 4, 20);
                ctx.strokeRect(p.x - 2, canvas.height - p.bottom, this.width + 4, 20);
            }
        },

        update: function() {
            // Add new pipe every 100 frames
            if (frames % 100 === 0) {
                // Calculate random heights
                // Available height is canvas.height - 20 (ground) - gap
                const maxTop = (canvas.height || 480) - 20 - this.gap - 20; // -20 for bottom pipe min height
                const minTop = 20;
                const topHeight = Math.floor(Math.random() * (maxTop - minTop + 1)) + minTop;
                const bottomHeight = (canvas.height || 480) - 20 - topHeight - this.gap;

                this.items.push({
                    x: canvas.width,
                    top: topHeight,
                    bottom: bottomHeight,
                    passed: false
                });
            }

            for (let i = 0; i < this.items.length; i++) {
                let p = this.items[i];
                p.x -= this.dx;

                // Collision Detection
                // Horizontal overlap
                if (bird.x + bird.radius > p.x && bird.x - bird.radius < p.x + this.width) {
                    // Vertical overlap (hit top pipe OR hit bottom pipe)
                    if ((bird.y - bird.radius < p.top) || (bird.y + bird.radius > (canvas.height || 480) - p.bottom)) {
                        console.log('PIPE COLLISION', {birdY: bird.y, birdVel: bird.velocity, birdRadius: bird.radius, pipeX: p.x, pipeTop: p.top, pipeBottom: p.bottom, canvasH: (canvas.height || 480), topHit: bird.y - bird.radius < p.top, bottomHit: bird.y + bird.radius > (canvas.height || 480) - p.bottom});
                        gameOver();
                    }
                }

                // Score update
                if (p.x + this.width < bird.x && !p.passed) {
                    score++;
                    scoreEl.innerText = score;
                    p.passed = true;
                }

                // Remove pipes that have gone off screen
                if (p.x + this.width < 0) {
                    this.items.shift();
                    i--;
                }
            }
        },

        reset: function() {
            this.items = [];
        }
    };

    // Background (Parallax)
    const background = {
        clouds: [],
        ground: { x: 0, height: 20 },

        draw: function() {
            // Draw Sky (already set in CSS, but we can draw gradients if needed)
            
            // Draw Clouds (Parallax layer 1 - slow)
            ctx.fillStyle = "#FFFFFF";
            this.clouds.forEach(cloud => {
                ctx.beginPath();
                ctx.arc(cloud.x, cloud.y, 20, 0, Math.PI * 2);
                ctx.arc(cloud.x + 25, cloud.y - 10, 25, 0, Math.PI * 2);
                ctx.arc(cloud.x + 50, cloud.y, 20, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw Ground
            ctx.fillStyle = "#D2B48C"; // Tan
            ctx.fillRect(0, canvas.height - this.ground.height, canvas.width, this.ground.height);
            ctx.strokeStyle = "#000";
            ctx.beginPath();
            ctx.moveTo(0, canvas.height - this.ground.height);
            ctx.lineTo(canvas.width, canvas.height - this.ground.height);
            ctx.stroke();

            // Ground Grass Top
            ctx.fillStyle = "#32CD32"; // LimeGreen
            ctx.fillRect(0, canvas.height - this.ground.height, canvas.width, 10);
            ctx.strokeStyle = "#000";
            ctx.beginPath();
            ctx.moveTo(0, canvas.height - this.ground.height + 10);
            ctx.lineTo(canvas.width, canvas.height - this.ground.height + 10);
            ctx.stroke();
        },

        update: function() {
            // Move clouds
            this.clouds.forEach(cloud => {
                cloud.x -= 0.5; // Slow movement
                if (cloud.x < -100) {
                    cloud.x = canvas.width + 100;
                    cloud.y = Math.random() * 150 + 20;
                }
            });
        },

        reset: function() {
            this.clouds = [];
            for(let i=0; i<5; i++) {
                this.clouds.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * 200 + 50
                });
            }
        }
    };

    // Game Loop
    function loop() {
        // DEBUG - comprehensive logging
        try {
            if (frames < 10 || frames % 60 === 0) {
                console.log('=== loop frame', frames, '===', {
                    gameState: gameState,
                    birdY: bird.y,
                    birdVel: bird.velocity,
                    canvasH: canvas.height,
                    canvasW: canvas.width,
                    birdRadius: bird.radius,
                    groundY: (canvas.height || 480) - 20,
                    birdBottom: bird.y + bird.radius,
                    pipesCount: pipes.items.length,
                    frames: frames
                });
            }
            
            if (gameState === 'PLAYING') {
            // Safety: ensure gameOverScreen is hidden when playing
            if (gameOverScreen.classList.contains('show')) {
                console.warn('gameOverScreen visible during PLAYING, forcing hide');
                gameOverScreen.classList.remove('show');
            }
            // Clear Canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Update
            background.update();
            bird.update();
            pipes.update();

            // Draw
            background.draw();
            pipes.draw();
            bird.draw();

            frames++;
        } else if (gameState === 'START') {
            // Just draw background and bird hovering
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            background.draw();
            bird.y = (canvas.height || 480) / 2 + Math.sin(Date.now() / 200) * 5; // Hover effect
            bird.velocity = 0; // Ensure no falling in start screen
            bird.draw();
        } else if (gameState === 'GAMEOVER') {
            // Static frame
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            background.draw();
            pipes.draw();
            bird.draw();
        }

        requestAnimationFrame(loop);
    } catch (err) {
        console.error('Loop error:', err, err.stack);
        // Don't stop the loop on error
        requestAnimationFrame(loop);
    }
    }

    // Game Control Functions
    function startGame() {
        console.log('startGame() called');
        // Forcefully hide both screens before changing state
        startScreen.style.display = 'none';
        gameOverScreen.classList.remove('show');
        // Force reflow to ensure display change takes effect
        void gameOverScreen.offsetHeight;
        void startScreen.offsetHeight;
        gameState = 'PLAYING';
        score = 0;
        frames = 0;
        scoreEl.innerText = score;
        bird.reset();
        pipes.reset();
        console.log('startGame() completed, bird.y:', bird.y, 'bird.vel:', bird.velocity, 'gameOverScreen hidden:', gameOverScreen.style.display);
        // loop() already running from initialization
    }

    function gameOver() {
        console.log('!!! GAME OVER !!!', {gameState, score, birdY: bird.y, birdVel: bird.velocity, frames, pipesCount: pipes.items.length, stack: new Error().stack});
        gameState = 'GAMEOVER';
        finalScoreEl.innerText = score;
        gameOverScreen.classList.add('show');
        // Ensure bird is centered for replay
        bird.reset();
        console.log('gameOver() called bird.reset()');
    }

    function resetGame() {
        startGame();
    }

    // Input Handling
    window.addEventListener('keydown', function(e) {
        if (e.code === 'Space') {
            handleInput();
        }
    });

    canvas.addEventListener('mousedown', function() {
        handleInput();
    });

    function handleInput() {
        if (gameState === 'PLAYING') {
            bird.flap();
        } else if (gameState === 'START') {
            startGame();
        } else if (gameState === 'GAMEOVER') {
            resetGame(); // Space bar restarts the game
        }
    }

    // Initialize
    background.reset();
    bird.reset();
    loop();

</script>

</body>
</html>
